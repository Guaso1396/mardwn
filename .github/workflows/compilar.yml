name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Renombrar APKs
        run: |
          mkdir -p salida
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$f" "salida/markdwn-$abi.apk"
          done
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: markdwn-apk
          path: salida/*.apk
      # Borra de la página de descargas los APK con nombres antiguos
      - name: Limpiar APK antiguos
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultima --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
            | grep -v '^markdwn-' | while read -r a; do
              gh release delete-asset ultima "$a" --repo "$GITHUB_REPOSITORY" -y
            done || true
      # Publica los APK en la página de Releases (descarga directa, sin iniciar sesión), con reintentos
      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          NOTAS="Descargue **markdwn-arm64-v8a.apk** (sirve para casi todos los celulares de los últimos años). Si no instala, pruebe **markdwn-armeabi-v7a.apk** (celulares antiguos de 32 bits). Compilado desde el commit $GITHUB_SHA."
          gh release view ultima --repo "$R" >/dev/null 2>&1 || gh release create ultima --repo "$R" --latest --title "markdwn (última versión)" --notes "$NOTAS"
          gh release edit ultima --repo "$R" --notes "$NOTAS"
          for f in salida/*.apk; do
            for intento in 1 2 3 4; do
              gh release upload ultima "$f" --clobber --repo "$R" && break
              echo "Reintento $intento para $f"; sleep $((intento * 10))
            done
          done
          gh release view ultima --repo "$R" --json assets -q '.assets[].name'
