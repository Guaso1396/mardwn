name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Renombrar APKs
        run: |
          mkdir -p salida
          for f in app/build/outputs/apk/debug/*.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$f" "salida/mardwn-$abi.apk"
          done
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: mardwn-apk
          path: salida/*.apk
      # Publica los APK en la página de Releases (descarga directa, sin iniciar sesión)
      - name: Publicar en Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: mardwn (última versión)
          prerelease: false
          make_latest: true
          body: |
            Descargue **mardwn-arm64-v8a.apk** (sirve para casi todos los celulares de los últimos años).
            Si no instala, pruebe **mardwn-armeabi-v7a.apk** (celulares antiguos de 32 bits).
            Compilado automáticamente desde el commit ${{ github.sha }}.
          files: salida/*.apk
