name: Probar en emulador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: |
          ./gradlew assembleDebug
          mkdir -p salida && cp app/build/outputs/apk/debug/app-x86_64-debug.apk salida/markdwn-x86_64.apk
      # Diagnóstico: ¿TikTok responde a yt-dlp (configuración normal) desde este servidor?
      - name: Diagnóstico de yt-dlp en el servidor
        run: |
          mkdir -p resultados
          pip install -q yt-dlp
          URLS="https://www.tiktok.com/@moxypatch/video/7206382937372134662
          https://www.tiktok.com/@tatemcrae/video/7107337212743830830
          https://www.tiktok.com/@hankgreen1/video/7047596209028074758
          https://www.tiktok.com/@leenabhushan/video/6748451240264420610"
          ELEGIDA=""
          for u in $URLS; do
            if yt-dlp -F "$u" > resultados/f.txt 2>&1; then r=OK; else r=FALLA; fi
            echo "$r $u" | tee -a resultados/diagnostico.txt
            tail -4 resultados/f.txt | sed 's/^/    /' | tee -a resultados/diagnostico.txt
            if [ "$r" = OK ] && [ -z "$ELEGIDA" ]; then ELEGIDA="$u"; cp resultados/f.txt resultados/formatos.txt; fi
          done
          echo "URL_PRUEBA=${ELEGIDA:-https://www.tiktok.com/@moxypatch/video/7206382937372134662}" >> "$GITHUB_ENV"
          if [ -n "$ELEGIDA" ]; then
            yt-dlp -f "download_addr-0/download" -o "resultados/con_marca.%(ext)s" "$ELEGIDA" || true
          fi
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/pruebas/prueba.sh
      - name: Fotogramas para revisar la marca de agua
        if: always()
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          cd resultados
          for v in video_app.mp4 con_marca.mp4; do
            [ -f "$v" ] || continue
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$v")
            for f in 0.15 0.5 0.85; do
              t=$(python3 -c "print($d*$f)")
              ffmpeg -loglevel error -y -ss "$t" -i "$v" -frames:v 1 -vf scale=360:-1 "${v%.mp4}_$f.png"
            done
          done
          ls -la
      - name: Publicar resultados (para revisarlos)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr resultados.zip resultados
          gh release view pruebas --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create pruebas --repo "$GITHUB_REPOSITORY" --prerelease --title "Resultados de pruebas automáticas" --notes "Capturas y registros de la última prueba en emulador."
          gh release upload pruebas resultados.zip --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-prueba
          path: resultados/
